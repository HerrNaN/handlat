name: Build Image
description: Build container image
inputs:
  tags:
    required: false
    description: Space-separated image tags, overriding event-based defaults
  github-token:
    required: true
    description: Github Token

outputs:
  digest:
    description: Digest of the published image
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Generate Image Tags
      id: tags
      shell: bash
      env:
        IMAGE_TAGS: ${{ inputs.tags }}
      run: |
        if [ -n "$IMAGE_TAGS" ]; then
          TAGS="$IMAGE_TAGS"
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          TAGS="pr-${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
        elif [ "${{ github.event_name }}" == "push" ] || [ "${{ github.ref_name }}" == "main" ]; then
          TAGS="devel ${{ github.sha }}"
        fi
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

    - run: "mise build"
      shell: bash

    - name: Build Image
      id: build
      uses: redhat-actions/buildah-build@v2
      with:
        image: ${{ github.repository }}
        containerfiles: Containerfile
        tags: ${{ steps.tags.outputs.tags }}

    - uses: redhat-actions/podman-login@v1
      with:
        registry: ${{ env.REGISTRY }}
        username: github_workflow
        password: ${{ inputs.github-token }}

    - name: Push Images
      id: push
      uses: redhat-actions/push-to-registry@v2
      with:
        registry: ${{ env.REGISTRY }}
        image: ${{ steps.build.outputs.image }}
        tags: ${{ steps.tags.outputs.tags }}
