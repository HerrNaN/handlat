name: Build Image
description: Build container image
inputs:
  github-token:
    required: true
    description: Github Token

outputs:
  repository:
    description: Fully qualified image repository
    value: ${{ steps.tags.outputs.repository }}
  digest:
    description: Digest of the published image
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Generate Image Tags
      id: tags
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        image="${GITHUB_REPOSITORY,,}"

        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          TAGS="pr-${PR_NUMBER} ${PR_HEAD_SHA}"
        elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
          TAGS="devel ${GITHUB_SHA}"
        else
          echo "Unsupported image publishing event" >&2
          exit 1
        fi

        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "repository=${REGISTRY}/$image" >> "$GITHUB_OUTPUT"
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

    - run: "mise build"
      shell: bash

    - name: Build Image
      id: build
      uses: redhat-actions/buildah-build@v2
      with:
        image: ${{ steps.tags.outputs.image }}
        containerfiles: Containerfile
        tags: ${{ steps.tags.outputs.tags }}

    - uses: redhat-actions/podman-login@v1
      with:
        registry: ${{ env.REGISTRY }}
        username: github_workflow
        password: ${{ inputs.github-token }}

    - name: Push Images
      id: push
      uses: redhat-actions/push-to-registry@v2
      with:
        registry: ${{ env.REGISTRY }}
        image: ${{ steps.build.outputs.image }}
        tags: ${{ steps.tags.outputs.tags }}
