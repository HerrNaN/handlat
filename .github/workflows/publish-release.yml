name: Publish Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: stable-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable image and chart
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag (vMAJOR.MINOR.PATCH): $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: jdx/mise-action@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote release image
        id: image
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          commit=$(git rev-parse HEAD)
          source_image="$repository:$commit"
          release_image="$repository:$RELEASE_VERSION"
          digest_file="$RUNNER_TEMP/release-image-digest"

          podman pull "$source_image"
          podman tag "$source_image" "$release_image"
          podman push --digestfile "$digest_file" "$release_image" "docker://$release_image"
          echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

      - name: Package and publish stable chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          package_dir="$RUNNER_TEMP/stable-charts"
          registry="oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts/stable"

          mise package-chart \
            --version "$RELEASE_VERSION" --app-version "$RELEASE_VERSION" \
            --image-repository "${REGISTRY}/${GITHUB_REPOSITORY,,}" \
            --image-digest "$IMAGE_DIGEST" --output-dir "$package_dir"

          printf '%s' "$GH_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin
          mise publish-chart "$package_dir/handlat-$RELEASE_VERSION.tgz" "$registry"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Stable published
          - Chart: \`$registry/handlat\`
          - Version: \`$RELEASE_VERSION\`
          - Commit: \`$(git rev-parse HEAD)\`
          - Image: \`${REGISTRY}/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST\`
          EOF
