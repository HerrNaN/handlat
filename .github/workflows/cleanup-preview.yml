name: Clean up preview packages

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed PR number to clean up
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const { cleanup } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cleanup-preview-packages.mts`);
            await cleanup({ github, context, core, prNumber: Number(process.env.PR_NUMBER) });
