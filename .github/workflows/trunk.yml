name: Trunk
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

# Only the newest main build needs to finish publishing.
concurrency:
  group: devel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Custom Image
    permissions:
      contents: read
      packages: write
      id-token: write
    # Ubuntu 24.04 has Podman 4 installed from scratch
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Verify
        shell: bash
        run: hk check --all

      - name: Test
        shell: bash
        run: hk run test --all

      - name: Build
        id: image
        uses: ./.github/actions/build-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package devel chart
        id: chart
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          : "${IMAGE_DIGEST:?missing published image digest}"
          export IMAGE_REPOSITORY="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          chart_dir="$RUNNER_TEMP/laga-devel"
          package_dir="$RUNNER_TEMP/charts"
          mkdir -p "$chart_dir" "$package_dir"
          cp -R deploy/charts/laga/. "$chart_dir/"

          yq -i '
            .image.repository = strenv(IMAGE_REPOSITORY) |
            .image.digest = strenv(IMAGE_DIGEST) |
            .image.tag = ""
          ' "$chart_dir/values.yaml"

          # Render the actual image defaults, supplying only environment settings.
          helm lint --strict "$chart_dir" \
            --set webAuthn.rpID=laga.example.com \
            --set webAuthn.origin=https://laga.example.com

          helm template laga "$chart_dir" \
            --set webAuthn.rpID=laga.example.com \
            --set webAuthn.origin=https://laga.example.com > /dev/null

          base_version=$(yq -r '.version' "$chart_dir/Chart.yaml")
          version="${base_version}-devel.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          helm package "$chart_dir" --destination "$package_dir" \
            --version "$version" --app-version "$GITHUB_SHA"

          echo "archive=$package_dir/laga-$version.tgz" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts/devel" >> "$GITHUB_OUTPUT"

      - name: Publish devel chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_ARCHIVE: ${{ steps.chart.outputs.archive }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_REGISTRY: ${{ steps.chart.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin

          helm push "$CHART_ARCHIVE" "$CHART_REGISTRY"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Devel published
          - Chart: \`$CHART_REGISTRY/laga\`
          - Version: \`$CHART_VERSION\`
          - Image: \`${REGISTRY}/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST\`
          EOF

      # Deployment is paused: the legacy infrastructure requires PostgreSQL.
      # Kubernetes deployment will be configured separately.
