name: Trunk
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

# Only the newest main build needs to finish publishing.
concurrency:
  group: devel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Custom Image
    permissions:
      contents: read
      packages: write
      id-token: write
    # Ubuntu 24.04 has Podman 4 installed from scratch
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and analysis
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
            ~/.cache/golangci-lint
          # Refresh after each commit, while reusing compatible earlier caches.
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Verify
        shell: bash
        run: hk check --all

      - name: Audit dependencies
        run: hk run audit --all

      - name: Test
        shell: bash
        run: hk run test --all

      - name: Validate chart packages
        run: mise test-chart-packages

      - name: Build
        id: image
        uses: ./.github/actions/build-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package devel chart
        id: chart
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          base_version=$(yq -r '.version' deploy/charts/handlat/Chart.yaml)
          version="${base_version}-$(date -u +%Y%m%d%H%M%S)"
          package_dir="$RUNNER_TEMP/charts"

          mise package-chart \
            --version "$version" --app-version "$GITHUB_SHA" \
            --image-repository "${REGISTRY}/${GITHUB_REPOSITORY,,}" \
            --image-digest "$IMAGE_DIGEST" --output-dir "$package_dir"

          {
            echo "archive=$package_dir/handlat-$version.tgz"
            echo "version=$version"
            echo "registry=oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts/devel"
          } >> "$GITHUB_OUTPUT"

      - name: Publish devel chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_ARCHIVE: ${{ steps.chart.outputs.archive }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_REGISTRY: ${{ steps.chart.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin

          mise publish-chart "$CHART_ARCHIVE" "$CHART_REGISTRY"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Devel published
          - Chart: \`$CHART_REGISTRY/handlat\`
          - Version: \`$CHART_VERSION\`
          - Image: \`${REGISTRY}/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST\`
          EOF
