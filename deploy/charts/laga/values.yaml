image:
  repository: ghcr.io/herrnan/laga
  # Set a commit SHA tag or, preferably, a digest. No implicit latest tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

webAuthn:
  rpID: ""
  # The public origin, including scheme and non-standard port if needed.
  origin: ""

logLevel: INFO

persistence:
  # Reuse a claim instead of creating one (for example after uninstall).
  existingClaim: ""
  size: 1Gi
  # Empty uses the cluster default; "-" explicitly disables dynamic provisioning.
  storageClass: ""
  # ReadWriteOncePod provides stronger single-pod enforcement if supported by CSI.
  accessMode: ReadWriteOnce

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # Existing TLS secret. TLS terminates at the ingress, not in the application.
  tlsSecretName: ""

resources: {}
