apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laga.fullname" . }}
  labels:
    {{- include "laga.labels" . | nindent 4 }}
spec:
  # SQLite uses one persistent database file. Do not scale this deployment out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laga.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laga.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: laga
          image: {{ include "laga.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/laga.sqlite
            - name: WEBAUTHN_RP_ID
              value: {{ required "webAuthn.rpID is required" .Values.webAuthn.rpID | quote }}
            - name: WEBAUTHN_ORIGIN
              value: {{ required "webAuthn.origin is required" .Values.webAuthn.origin | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "laga.claimName" . }}
