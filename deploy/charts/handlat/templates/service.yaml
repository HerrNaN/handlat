apiVersion: v1
kind: Service
metadata:
  name: {{ include "handlat.fullname" . }}
  labels:
    {{- include "handlat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "handlat.selectorLabels" . | nindent 4 }}
