[tools]
# Misc.
pulumi = "latest"
"github:MrLesk/Backlog.md" = "latest"
hk = "latest"
pkl = "latest"
gh = "latest"
helm = "4.3.1"
yq = "4"
# Needed for pkl language server
java = "24"

# Golang
go = "1.26"
gofumpt = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:golangci/golines" = "latest"
"github:securego/gosec" = "latest"
golangci-lint = "latest"
sqlc = "latest"

# Web
node = "24"
pnpm = "11"
oxlint = "latest"

[shell_alias]
backlog = "backlog-bun"

# === Development ===

[tasks.dev]
description = "Run in development mode"
depends = ["dev-fe", "dev-be"]

[tasks.dev-fe]
dir = "frontend"
run = "pnpm dev"
hide = true

[tasks.dev-be]
depends = ["generate"]
dir = "backend"
run = "go run ./cmd/laga"
env.EXTERNAL_WEB_SERVER_ADDRESS = "http://localhost:5173"
env.PORT = 8080
env.DATABASE_PATH = "../_data/laga.sqlite"
env.WEBAUTHN_RP_ID = "localhost"
env.WEBAUTHN_ORIGIN = "http://localhost:8080"
hide = true

# === Building ===

[tasks.build]
depends = ["build-fe", "generate"]
dir = "backend/cmd/laga"
run = "go build ."
env.CGO_ENABLED = 0
hide = true

[tasks.build-fe]
dir = "frontend"
run = "pnpm run build"
hide = true

[tasks.preview]
description = "Preview build for production"
depends = ["build-fe", "generate"]
dir = "backend/cmd/laga"
run = "go run ."
env.PORT = 9090
env.DATABASE_PATH = "../../../_data/laga.sqlite"
env.WEBAUTHN_RP_ID = "localhost"
env.WEBAUTHN_ORIGIN = "http://localhost:9090"

[tasks.generate]
description = "Regenerate sqlc queries"
dir = "backend"
run = "sqlc generate"

# === Backlog ===

[tasks.backlog-web]
description = "Run backlog web UI"
run = "backlog-bun browser"

# === Deployment ===

[tasks.deploy]
description = "Deploy application IaC"
dir = "deploy/infra"
usage = '''
flag "--non-interactive"
'''
run = """
#!/usr/bin/env bash

if [[ -z "${SCW_ACCESS_KEY:-}" ]]; then
    read -p "Enter Scalway access key: " SCW_ACCESS_KEY
fi
if [[ -z "${SCW_SECRET_KEY:-}" ]]; then
    read -p "Enter Scalway secret key: " SCW_SECRET_KEY
fi

export SCW_ACCESS_KEY
export SCW_SECRET_KEY
export AWS_ACCESS_KEY=$SCW_ACCESS_KEY
export AWS_SECRET_KEY=$SCW_SECRET_KEY

pulumi login 's3://laga-pulumi-state?endpoint=https://s3.fr-par.scw.cloud&region=fr-par'
pulumi stack select prod

if [ "${usage_non_interactive:-false}" = "true" ]; then
    pulumi up --yes --non-interactive --suppress-progress
else
    pulumi up
fi

pulumi logout
"""

[tasks.bootstrap]
description = "Deploy bootstrap IaC"
confirm = "You are about to deploy BOOTSTRAP, are you sure?"
dir = "deploy/bootstrap"
run = """
#!/usr/bin/env bash

echo -n "Enter Scalway access key: "
read SCW_ACCESS_KEY
echo -n "Enter Scalway secret key: "
read SCW_SECRET_KEY

export SCW_ACCESS_KEY
export SCW_SECRET_KEY
export AWS_ACCESS_KEY=$SCW_ACCESS_KEY
export AWS_SECRET_KEY=$SCW_SECRET_KEY

pulumi login 's3://laga-pulumi-state-admin?endpoint=https://s3.fr-par.scw.cloud&region=fr-par'
pulumi stack select prod

pulumi up

pulumi logout
"""
