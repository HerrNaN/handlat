[tools]
# Misc.
pulumi = "latest"
"github:MrLesk/Backlog.md" = "latest"
hk = "latest"
pkl = "latest"
gh = "latest"
helm = "4.3.1"
yq = "4"
# Needed for pkl language server
java = "24"

# Golang
go = "1.26"
gofumpt = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:golangci/golines" = "latest"
"github:securego/gosec" = "latest"
golangci-lint = "latest"
sqlc = "latest"

# Web
node = "24"
pnpm = "11"
oxlint = "latest"

[shell_alias]
backlog = "backlog-bun"

# === Development ===

[tasks.dev]
description = "Run in development mode"
run = [{ tasks = ["dev-fe", "dev-be"] }]

[tasks.dev-fe]
dir = "frontend"
run = "pnpm dev"
hide = true
silent = "stdout"

[tasks.dev-be]
depends = ["generate"]
dir = "backend"
run = "go run ./cmd/handlat"
env.EXTERNAL_WEB_SERVER_ADDRESS = "http://localhost:5173"
env.PORT = 8080
env.DATABASE_PATH = "../_data/laga.sqlite"
env.WEBAUTHN_RP_ID = "localhost"
env.WEBAUTHN_ORIGIN = "http://localhost:8080"
hide = true

# === Building ===

[tasks.build]
depends = ["build-fe", "generate"]
dir = "backend/cmd/handlat"
run = "go build ."
env.CGO_ENABLED = 0
hide = true

[tasks.build-fe]
dir = "frontend"
run = "pnpm run build"
hide = true

[tasks.preview]
description = "Preview build for production"
depends = ["build-fe", "generate"]
dir = "backend/cmd/handlat"
run = "go run ."
env.PORT = 9090
env.DATABASE_PATH = "../../../_data/laga.sqlite"
env.WEBAUTHN_RP_ID = "localhost"
env.WEBAUTHN_ORIGIN = "http://localhost:9090"

[tasks.generate]
description = "Regenerate sqlc queries"
dir = "backend"
run = "sqlc generate"

# === Backlog ===

[tasks.backlog-web]
description = "Run backlog web UI"
run = "backlog-bun browser"

# === Deployment ===

[tasks.package-chart]
description = "Package a Helm chart pinned to an image digest"
usage = '''
flag "--version <version>" required=#true
flag "--app-version <app_version>" required=#true
flag "--image-repository <image_repository>" required=#true
flag "--image-digest <image_digest>" required=#true
flag "--output-dir <output_dir>" default="_data/charts"
'''
run = [
  'mkdir -p "$usage_output_dir/source"',
  'cp -R deploy/charts/handlat/. "$usage_output_dir/source/"',
  '''
  yq -i '
    .image.repository = strenv(usage_image_repository) |
    .image.digest = strenv(usage_image_digest) |
    .image.tag = ""
  ' "$usage_output_dir/source/values.yaml"
  ''',
  'helm lint --strict "$usage_output_dir/source" --set webAuthn.rpID=laga.example.com --set webAuthn.origin=https://laga.example.com',
  'helm template handlat "$usage_output_dir/source" --set webAuthn.rpID=laga.example.com --set webAuthn.origin=https://laga.example.com > /dev/null',
  'helm package "$usage_output_dir/source" --destination "$usage_output_dir" --version "$usage_version" --app-version "$usage_app_version"',
]

[tasks.publish-chart]
description = "Publish a packaged Helm chart to an OCI registry"
usage = '''
arg "<archive>"
arg "<registry>"
'''
run = 'helm push "$usage_archive" "$usage_registry"'
