version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/app/migrations"
    queries: "internal/app/auth/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/app/auth/db"
        emit_pointers_for_null_types: true
  - engine: "sqlite"
    schema: "internal/app/migrations"
    queries: "internal/app/list/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/app/list/db"
        emit_pointers_for_null_types: true
